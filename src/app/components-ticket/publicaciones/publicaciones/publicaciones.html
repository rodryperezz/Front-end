<div class="container-fluid py-4 px-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body text-center py-4" style="background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 8px;">
          <h2 class="text-white fw-bold mb-0">📝 Publicaciones</h2>
        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary px-4 fw-bold" (click)="VisibleFormulario()">
          {{ mostrarFormulario ? '✖ Cerrar' : '➕ Nueva Publicación' }}
        </button>
      </div>

      <div *ngIf="mostrarFormulario" class="card shadow-sm border-0 mb-4">
        <div class="card-header fw-bold text-white" style="background: #1a1a2e;">
          {{ isEditing ? '✏️ Editar Publicación' : '➕ Nueva Publicación' }}
        </div>
        <div class="card-body p-4">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Título</label>
              <input type="text" class="form-control" [(ngModel)]="publicacion.Titulo" placeholder="Título de la publicación">
            </div>
            <div class="col-md-5">
              <label class="form-label fw-semibold">Contenido</label>
              <input type="text" class="form-control" [(ngModel)]="publicacion.Contenido" placeholder="Contenido">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Fecha</label>
              <input type="date" class="form-control" [(ngModel)]="publicacion.FechaPublicacion">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success fw-bold" (click)="CreatePublicacion()">
              <i class="bi bi-plus-circle me-1"></i> Crear
            </button>
            <button class="btn btn-warning fw-bold" (click)="UpdatePublicacion()">
              <i class="bi bi-pencil-square me-1"></i> Guardar Cambios
            </button>
            <button class="btn btn-outline-secondary fw-bold" (click)="publicacion=resetFormulario()">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Limpiar
            </button>
          </div>
        </div>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead style="background: #1a1a2e;">
              <tr>
                <th class="text-white py-3 ps-3">#</th>
                <th class="text-white py-3">Título</th>
                <th class="text-white py-3">Contenido</th>
                <th class="text-white py-3">Fecha</th>
                <th class="text-white py-3">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let pub of publicaciones; let i = index">
                <td class="ps-3 align-middle text-muted">{{ i + 1 }}</td>
                <td class="align-middle fw-semibold">{{ pub.Titulo }}</td>
                <td class="align-middle text-muted">{{ pub.Contenido }}</td>
                <td class="align-middle text-muted">{{ pub.FechaPublicacion }}</td>
                <td class="align-middle">
                  <button class="btn btn-sm btn-outline-primary me-1" (click)="seleccionarPublicacion(pub)">
                    <i class="bi bi-pencil me-1"></i>Editar
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="DeletePublicacion(pub.Id)">
                    <i class="bi bi-trash me-1"></i>Eliminar
                  </button>
                </td>
              </tr>
              <tr *ngIf="publicaciones.length === 0">
                <td colspan="5" class="text-center text-muted py-4">No hay publicaciones registradas.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
