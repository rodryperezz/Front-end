<div class="container-fluid py-4 px-4">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body text-center py-4" style="background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 8px;">
          <h2 class="text-white fw-bold mb-0">💬 Comentarios</h2>
        </div>
      </div>

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <label class="form-label fw-semibold">Buscar comentarios por ID de Publicación</label>
          <div class="d-flex gap-2">
            <input type="number" class="form-control w-auto" [(ngModel)]="publiIdBuscar" placeholder="Ej: 1">
            <button class="btn btn-primary fw-bold" (click)="GetComentariosByPubli()">
              🔍 Buscar
            </button>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary px-4 fw-bold" (click)="VisibleFormulario()">
          {{ mostrarFormulario ? '✖ Cerrar' : '➕ Nuevo Comentario' }}
        </button>
      </div>

      <div *ngIf="mostrarFormulario" class="card shadow-sm border-0 mb-4">
  <div class="card-header fw-bold text-white" style="background: #1a1a2e;">
    ➕ Agregar Comentario
  </div>
  <div class="card-body p-4">
    <div class="mb-3">
      <label class="form-label fw-semibold">ID de la Publicación</label>
      <input type="number" class="form-control" [(ngModel)]="publiIdBuscar" placeholder="Ej: 1">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Contenido</label>
      <input type="text" class="form-control" [(ngModel)]="contenido" placeholder="Escribí tu comentario...">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success fw-bold" (click)="CreateComentario()">
        💬 Comentar
      </button>
      <button class="btn btn-outline-secondary fw-bold" (click)="limpiarContenido()">
        🔄 Limpiar
      </button>
    </div>
  </div>
</div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead style="background: #1a1a2e;">
              <tr>
                <th class="text-white py-3 ps-3">#</th>
                <th class="text-white py-3">Contenido</th>
                <th class="text-white py-3">Fecha</th>
                <th class="text-white py-3">Usuario ID</th>
                <th class="text-white py-3">Publicación ID</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let com of comentarios; let i = index">
                <td class="ps-3 align-middle text-muted">{{ i + 1 }}</td>
                <td class="align-middle">{{ com.Contenido }}</td>
                <td class="align-middle text-muted">{{ com.FechaComentario }}</td>
                <td class="align-middle text-muted">{{ com.UsuarioId }}</td>
                <td class="align-middle text-muted">{{ com.PublicacionId }}</td>
              </tr>
              <tr *ngIf="comentarios.length === 0">
                <td colspan="5" class="text-center text-muted py-4">No hay comentarios. Buscá por ID de publicación.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
